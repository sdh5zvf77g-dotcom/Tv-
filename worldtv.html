<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WorldTV</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--tx:#eef0f4;--mu:#8b93a3;--ac:#4f8cff}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f8;--card:#fff;--tx:#14161a;--mu:#5d6676}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;flex-wrap:wrap;gap:8px;padding:10px;position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:18px;margin:0;flex:1 1 100%}
select,input{flex:1 1 140px;padding:10px;border-radius:10px;border:1px solid #3333;background:var(--card);color:var(--tx);font-size:15px}
video{width:100%;max-height:45vh;background:#000;display:block}
#now{padding:8px 12px;color:var(--mu);min-height:34px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px}
.ch{background:var(--card);border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;cursor:pointer;position:relative}
.ch.on{outline:2px solid var(--ac)}
.ch img{width:36px;height:36px;object-fit:contain;border-radius:6px;background:#fff2}
.ch span{font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;flex:1}
.fav{background:none;border:0;color:var(--mu);font-size:18px;padding:2px}
.fav.s{color:#ffc83d}
button.t{padding:10px;border-radius:10px;border:1px solid #3333;background:var(--card);color:var(--tx)}
button.t.on{background:var(--ac);color:#fff}
</style>
</head>
<body>
<header>
  <h1>🌍 WorldTV <small style="color:var(--mu);font-weight:400">free live channels</small></h1>
  <select id="country"></select>
  <select id="cat"><option value="">All categories</option></select>
  <input id="q" placeholder="Search channels" type="search">
  <button class="t" id="favBtn">★ Favorites</button>
</header>
<video id="v" controls autoplay playsinline></video>
<div id="now">Pick a country, then tap a channel.</div>
<div id="list"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const BASE='https://iptv-org.github.io/';
let chans=[],hls=null,cur=null,favOnly=false;
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let favs=store.get('favs',[]);

function parse(t){
  const out=[];let m=null;
  for(const l of t.split('\n')){
    if(l.startsWith('#EXTINF')){
      m={name:l.split(',').pop().trim(),
         logo:(l.match(/tvg-logo="([^"]*)"/)||[])[1]||'',
         cat:((l.match(/group-title="([^"]*)"/)||[])[1]||'General').split(';')[0]};
    }else if(m&&l.startsWith('http')){m.url=l.trim();out.push(m);m=null}
  }
  return out;
}

async function loadCountries(){
  const sel=$('country');
  try{
    const r=await fetch(BASE+'iptv/countries.json').catch(()=>null);
    let list=r&&r.ok?await r.json():null;
    if(!list){const r2=await fetch(BASE+'api/countries.json');list=await r2.json()}
    list=list.map(c=>({code:c.code.toLowerCase(),name:c.name,flag:c.flag||''})).sort((a,b)=>a.name.localeCompare(b.name));
    sel.innerHTML=list.map(c=>`<option value="${c.code}">${c.flag} ${c.name}</option>`).join('');
    const guess=(navigator.language.split('-')[1]||'us').toLowerCase();
    const saved=store.get('country',null)||guess;
    sel.value=[...sel.options].some(o=>o.value===saved)?saved:'us';
    loadChannels();
  }catch(e){$('now').textContent='Could not load country list. Check your connection.'}
}

async function loadChannels(){
  const code=$('country').value;store.set('country',code);
  $('list').innerHTML='';$('now').textContent='Loading channels…';
  try{
    const r=await fetch(`${BASE}iptv/countries/${code}.m3u`);
    if(!r.ok)throw 0;
    chans=parse(await r.text());
    const cats=[...new Set(chans.map(c=>c.cat))].sort();
    $('cat').innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option>${c}</option>`).join('');
    $('now').textContent=chans.length?`${chans.length} channels. Tap one to watch.`:'No channels listed for this country.';
    render();
  }catch(e){$('now').textContent='No channel list available for this country.'}
}

function render(){
  const q=$('q').value.toLowerCase(),cat=$('cat').value;
  const items=chans.filter(c=>(!cat||c.cat===cat)&&c.name.toLowerCase().includes(q)&&(!favOnly||favs.includes(c.url)));
  const box=$('list');box.innerHTML='';
  items.slice(0,400).forEach(c=>{
    const d=document.createElement('div');
    d.className='ch'+(cur===c.url?' on':'');
    const img=document.createElement('img');img.src=c.logo;img.loading='lazy';img.onerror=()=>img.style.visibility='hidden';
    const s=document.createElement('span');s.textContent=c.name;
    const f=document.createElement('button');f.className='fav'+(favs.includes(c.url)?' s':'');f.textContent='★';
    f.onclick=e=>{e.stopPropagation();favs=favs.includes(c.url)?favs.filter(x=>x!==c.url):[...favs,c.url];store.set('favs',favs);render()};
    d.append(img,s,f);d.onclick=()=>play(c);box.append(d);
  });
}

function play(c){
  cur=c.url;$('now').textContent='▶ '+c.name;
  const v=$('v');
  if(hls){hls.destroy();hls=null}
  if(window.Hls&&Hls.isSupported()){
    hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v);
    hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)$('now').textContent='⚠ '+c.name+' is offline or blocked. Try another channel.'});
  }else{v.src=c.url}
  v.play().catch(()=>{});
  render();
}

$('country').onchange=loadChannels;
$('cat').onchange=render;
$('q').oninput=render;
$('favBtn').onclick=e=>{favOnly=!favOnly;e.target.classList.toggle('on',favOnly);render()};
loadCountries();
</script>
</body>
</html>
